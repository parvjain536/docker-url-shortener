name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone repo into GitHub runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Python for Linting and Testing
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Install test dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest httpx -r requirements.txt

      # Step 4: Code Quality & Syntax Check (Linting)
      - name: Lint Code with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # Step 5: Set up Docker Buildx (Advanced layer caching engine)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 6: Authenticate with Docker Hub using Encrypted Secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 7: Build and Push Production Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/docker-url-shortener:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/docker-url-shortener:${{ github.sha }}